<div class="main-layout">
  <mat-sidenav-container class="app-container">
    <mat-sidenav
      #drawer
      class="sidebar"
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="!isMobile()"
    >
      <div class="brand">
        <div class="brand-logo">
          <img src="favicon.svg" width="43" height="43" alt="" />
        </div>
        <div>
          <strong>Yaman<span>Tracker</span></strong>
          <small>Personal Finance Management System</small>
        </div>
      </div>

      <div class="nav-heading">YOUR FINANCES</div>

      <mat-nav-list class="navigation">
        <a
          mat-list-item
          routerLink="/dashboard"
          routerLinkActive="active-link"
          (click)="closeOnMobile()"
        >
          <mat-icon matListItemIcon
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <use href="ui-icons.svg#dashboard"></use></svg
          ></mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>

        <a
          mat-list-item
          routerLink="/transactions"
          routerLinkActive="active-link"
          (click)="closeOnMobile()"
        >
          <mat-icon matListItemIcon
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <use href="ui-icons.svg#receipt_long"></use></svg
          ></mat-icon>
          <span matListItemTitle>Transactions</span>
        </a>

        <a
          mat-list-item
          routerLink="/budgets"
          routerLinkActive="active-link"
          (click)="closeOnMobile()"
        >
          <mat-icon matListItemIcon
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <use href="ui-icons.svg#account_balance"></use></svg
          ></mat-icon>
          <span matListItemTitle>Budgets</span>
        </a>

        <a
          mat-list-item
          routerLink="/categories"
          routerLinkActive="active-link"
          (click)="closeOnMobile()"
        >
          <mat-icon matListItemIcon
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <use href="ui-icons.svg#category"></use></svg
          ></mat-icon>
          <span matListItemTitle>Categories</span>
        </a>
        <a
          mat-list-item
          routerLink="/bank-connections"
          routerLinkActive="active-link"
          (click)="closeOnMobile()"
        >
          <mat-icon matListItemIcon
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <use href="ui-icons.svg#sync_alt"></use></svg
          ></mat-icon>
          <span matListItemTitle>Bank Connections</span>
        </a>
        <button mat-list-item type="button" (click)="openAssistant()">
          <mat-icon matListItemIcon
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <use href="ui-icons.svg#smart_toy"></use></svg></mat-icon
          ><span matListItemTitle>AI Assistant</span>
        </button>
        <button mat-list-item type="button" (click)="openAssistant(true)">
          <mat-icon matListItemIcon
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <use href="ui-icons.svg#history"></use></svg></mat-icon
          ><span matListItemTitle>History</span>
        </button>
      </mat-nav-list>

      <div class="sidebar-footer">
        <mat-icon
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <use href="ui-icons.svg#auto_awesome"></use></svg
        ></mat-icon>
        <span>Manage your finances smarter.</span>
      </div>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar class="topbar">
        <button mat-icon-button aria-label="Toggle sidebar" (click)="drawer.toggle()">
          <mat-icon
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <use href="ui-icons.svg#menu"></use></svg
          ></mat-icon>
        </button>

        <span class="toolbar-brand">YamanTracker</span>
        <span class="toolbar-title">{{ pageTitle() }}</span>

        <span class="spacer"></span>

        <button
          mat-icon-button
          class="theme-switch"
          [class.is-dark]="isDarkMode()"
          [attr.aria-pressed]="isDarkMode()"
          type="button"
          [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
          (click)="toggleTheme()"
        >
          <span class="theme-thumb"></span>
        </button>

        <a
          class="profile"
          routerLink="/account-settings"
          routerLinkActive="profile-active"
          ariaCurrentWhenActive="page"
          aria-label="Account Settings"
          title="Account Settings"
          (click)="closeOnMobile()"
        >
          <div class="profile-avatar" aria-hidden="true">{{ initials() }}</div>
          <span [title]="auth.currentUser()?.email ?? ''">{{ auth.currentUser()?.name }}</span>
        </a>

        <button mat-button type="button" (click)="auth.logout()">Logout</button>
      </mat-toolbar>

      <main class="main-content">
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <app-ai-assistant />
</div>
