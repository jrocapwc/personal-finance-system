spring.application.name=core-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=personal-finance-core-api
app.jwt.audience=personal-finance-core-api

# Reject fields such as roles, id, or passwordHash in request DTOs.
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Document only the versioned application API; keep bearer tokens in memory only.
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.persist-authorization=false
springdoc.override-with-generic-response=false

# Dedicated internal insights client; an absent key disables only insights requests.
app.ai.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
app.ai.internal-api-key=${AI_INTERNAL_API_KEY:}
app.ai.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:2s}
app.ai.read-timeout=${AI_SERVICE_READ_TIMEOUT:5s}

# Spring web DEBUG diagnostics include request/response bodies and rejected values.
# Keep financial records and identities out even if a parent Spring logger is set to DEBUG.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
# Constraint diagnostics can include the email value during concurrent registration.
# The API handles these conflicts without logging database exception messages.
logging.level.org.hibernate.orm.jdbc.error=OFF

# Dedicated local Node mock provider; independent of FastAPI's internal credential.
app.integration.base-url=${INTEGRATION_SERVICE_BASE_URL:http://127.0.0.1:3001}
app.integration.internal-api-key=${INTEGRATION_INTERNAL_API_KEY:}
app.integration.connect-timeout=${INTEGRATION_CONNECT_TIMEOUT:2s}
app.integration.read-timeout=${INTEGRATION_READ_TIMEOUT:3s}

# Statement uploads stay in memory; raw files are never retained by this workflow.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1100KB
spring.servlet.multipart.file-size-threshold=2MB

# Prevent financial values appearing in JDBC bind diagnostics even under a parent TRACE logger.
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
