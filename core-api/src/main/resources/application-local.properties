spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/personal-financedb}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/mysql
spring.jpa.hibernate.ddl-auto=validate

# Explicit HTTP-only local development; production keeps Secure __Host- cookies.
app.auth.cookie.name=finance_session
app.auth.cookie.secure=false
